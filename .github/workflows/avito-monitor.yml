name: MacBook Pro - Avito + Pages
on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/avito-monitor.yml'
      - 'tools/avito-monitor/**'
      - 'tools/retail-monitor/**'

concurrency:
  group: macbook-pages
  cancel-in-progress: false

jobs:
  gate:
    name: Hourly freshness gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Checkout monitor
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check snapshot age and schedule
        id: gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/retail-monitor/gate.mjs

  collect:
    name: Collect Avito listings
    needs: gate
    if: ${{ needs.gate.outputs.should_run == 'true' && github.repository == 'Web-Usov/dashboard' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
    steps:
      - name: Checkout integration
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run parser and merge tests
        run: node --test tools/avito-monitor/*.test.mjs
      - name: Search Avito and update the JSON
        if: env.APIFY_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APIFY_MAX_ITEMS: '12'
        run: node tools/avito-monitor/index.mjs
      - name: Explain missing API key
        if: env.APIFY_TOKEN == ''
        run: echo 'APIFY_TOKEN not set; skip Avito without blocking the Pages deployment.'

  retail:
    name: Verify retail prices
    needs: gate
    if: ${{ needs.gate.outputs.should_run == 'true' && github.repository == 'Web-Usov/dashboard' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout retail integration
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test retail parser
        run: node --test tools/retail-monitor/*.test.mjs
      - name: Fetch product prices and append real hourly measurements
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/retail-monitor/index.mjs
      - name: Verify fresh JSON was actually saved
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/retail-monitor/status.mjs

  deploy:
    name: Publish latest gh-pages
    needs: [gate, collect, retail]
    # Publishing must not depend on Avito (which can hit API limits or timeout).
    if: ${{ !cancelled() && needs.gate.outputs.should_run == 'true' && github.repository == 'Web-Usov/dashboard' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest published data
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          persist-credentials: false
          path: pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
