name: MacBook Pro - Avito + Pages
on:
  workflow_dispatch:
  schedule:
    # Run 20 minutes after the hourly ChatGPT retail collector.
    - cron: '20 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: macbook-pages
  cancel-in-progress: false
jobs:
  collect-and-deploy:
    if: github.repository == 'Web-Usov/dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout integration
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run parsing tests
        run: node --test tools/avito-monitor/*.test.mjs
      - name: Search Avito and merge into gh-pages/data.json
        if: env.APIFY_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APIFY_MAX_ITEMS: '12'
        run: node tools/avito-monitor/index.mjs
      - name: Explain missing API key
        if: env.APIFY_TOKEN == ''
        run: echo 'Save APIFY_TOKEN in repository Settings > Secrets and variables > Actions to enable collection.'
      - name: Checkout latest gh-pages contents
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
