# Temporary independent diagnostic: confirms GitHub emits actual schedule events.
name: Cron Probe (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  heartbeat:
    name: Scheduler heartbeat
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Record trigger and UTC timestamp
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "trigger=${EVENT_NAME}"
          echo "cron=${CRON_SCHEDULE:-none}"
          echo "branch=${REF_NAME}"
          echo "utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          {
            echo "### GitHub cron heartbeat"
            echo "- Event: **${EVENT_NAME}**"
            echo "- Expected cron: \`*/5 * * * *\`"
            echo "- Received cron: \`${CRON_SCHEDULE:-none}\`"
            echo "- Started at UTC: \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`"
          } >> "${GITHUB_STEP_SUMMARY}"
